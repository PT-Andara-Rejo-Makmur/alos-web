name: Kualitas ALOS Web

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/alos-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: workspace/alos-web

      - name: Checkout canonical contracts
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-contracts
          ref: main
          path: workspace/alos-contracts
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Siapkan pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/alos-web/pnpm-lock.yaml

      - name: Pasang dependency
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
